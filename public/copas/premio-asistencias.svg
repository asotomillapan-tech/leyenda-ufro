<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" fill="none">
  <defs>
    <!-- Premio Cerebro / Asistencias: Brújula & Arco de Pase Platino-Oro -->
    <linearGradient id="astSilver" x1="55" y1="35" x2="185" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="28%" stop-color="#f8fafc"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="82%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="astGold" x1="55" y1="30" x2="185" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9e670b"/>
      <stop offset="28%" stop-color="#f7cf54"/>
      <stop offset="52%" stop-color="#fff8cc"/>
      <stop offset="100%" stop-color="#875407"/>
    </linearGradient>

    <linearGradient id="astIndigo" x1="80" y1="60" x2="160" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#717fff"/>
    </linearGradient>

    <linearGradient id="astPedestal" x1="65" y1="205" x2="175" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292934"/>
      <stop offset="50%" stop-color="#17171f"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>

    <radialGradient id="astGlow" cx="120" cy="120" r="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#717fff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="122" r="102" fill="url(#astGlow)"/>
  <ellipse cx="120" cy="268" rx="64" ry="7" fill="#000000" fill-opacity="0.45"/>

  <!-- Pedestal oscuro -->
  <path d="M58 254 L182 254 L187 265 L53 265 Z" fill="url(#astPedestal)" stroke="#3f3f4e" stroke-width="1.2"/>
  <path d="M70 212 L170 212 L177 253 L63 253 Z" fill="url(#astPedestal)" stroke="#3b3b48" stroke-width="1.4"/>
  <rect x="82" y="220" width="76" height="24" rx="3" fill="url(#astSilver)" stroke="#475569" stroke-width="1.2"/>
  <text x="120" y="236" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="10" letter-spacing="0.8" fill="#1e1b4b">ASISTENCIAS</text>

  <!-- Tallo retorcido elegante -->
  <path d="M106 178 C100 192 90 202 82 212 L158 212 C150 202 140 192 134 178 Z"
        fill="url(#astSilver)" stroke="#475569" stroke-width="1.2"/>

  <!-- Anillo orbital de precisión -->
  <circle cx="120" cy="112" r="64" stroke="url(#astSilver)" stroke-width="9"/>
  <circle cx="120" cy="112" r="56" stroke="url(#astGold)" stroke-width="2.5"/>
  <circle cx="120" cy="112" r="46" fill="url(#astIndigo)" opacity="0.9"/>

  <!-- Mirilla / Brújula táctica + balón dorado en trayectoria de pase -->
  <line x1="120" y1="62" x2="120" y2="162" stroke="#c7d2fe" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="70" y1="112" x2="170" y2="112" stroke="#c7d2fe" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M84 142 Q112 96 154 84" stroke="#fff8cc" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Punta de flecha de asistencia -->
  <path d="M142 78 L160 82 L149 97" stroke="#fff8cc" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Punto de partida dorado -->
  <circle cx="84" cy="142" r="7" fill="url(#astGold)" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Estrella central de visión -->
  <path d="M120 96 L124 108 L136 112 L124 116 L120 128 L116 116 L104 112 L116 108 Z"
        fill="url(#astGold)" stroke="#ffffff" stroke-width="1"/>
</svg>
