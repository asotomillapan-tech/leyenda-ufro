<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" fill="none">
  <defs>
    <!-- Botín de Oro (Goleador) -->
    <linearGradient id="bootGold" x1="40" y1="65" x2="205" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9e670b"/>
      <stop offset="22%" stop-color="#f7cf54"/>
      <stop offset="46%" stop-color="#fff8cc"/>
      <stop offset="72%" stop-color="#d89d1c"/>
      <stop offset="100%" stop-color="#875407"/>
    </linearGradient>

    <linearGradient id="bootSole" x1="42" y1="145" x2="200" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <linearGradient id="bootPedestal" x1="65" y1="205" x2="175" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292934"/>
      <stop offset="50%" stop-color="#17171f"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>

    <radialGradient id="bootGlow" cx="120" cy="130" r="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="130" r="102" fill="url(#bootGlow)"/>
  <ellipse cx="120" cy="268" rx="68" ry="7" fill="#000000" fill-opacity="0.45"/>

  <!-- Pedestal oscuro -->
  <path d="M54 254 L186 254 L191 265 L49 265 Z" fill="url(#bootPedestal)" stroke="#3f3f4e" stroke-width="1.2"/>
  <path d="M68 210 L172 210 L179 253 L61 253 Z" fill="url(#bootPedestal)" stroke="#3b3b48" stroke-width="1.4"/>
  <rect x="86" y="218" width="68" height="24" rx="3" fill="url(#bootGold)" stroke="#8c580a" stroke-width="1.2"/>
  <text x="120" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="10" letter-spacing="0.9" fill="#451a03">GOLEADOR</text>

  <!-- Soportes metálicos bajo el botín -->
  <rect x="78" y="176" width="12" height="34" rx="4" fill="url(#bootGold)" stroke="#8a5609" stroke-width="1"/>
  <rect x="148" y="182" width="12" height="28" rx="4" fill="url(#bootGold)" stroke="#8a5609" stroke-width="1"/>

  <!-- Botín de fútbol dorado inclinado -->
  <g transform="rotate(-10 120 135)">
    <!-- Estoperoles (tacos) -->
    <rect x="58" y="168" width="10" height="11" rx="2.5" fill="url(#bootGold)" stroke="#78350f" stroke-width="1"/>
    <rect x="76" y="168" width="10" height="11" rx="2.5" fill="url(#bootGold)" stroke="#78350f" stroke-width="1"/>
    <rect x="136" y="168" width="10" height="11" rx="2.5" fill="url(#bootGold)" stroke="#78350f" stroke-width="1"/>
    <rect x="156" y="168" width="10" height="11" rx="2.5" fill="url(#bootGold)" stroke="#78350f" stroke-width="1"/>
    <rect x="174" y="168" width="10" height="11" rx="2.5" fill="url(#bootGold)" stroke="#78350f" stroke-width="1"/>

    <!-- Suela -->
    <path d="M46 156 L194 156 C198 164 192 170 182 170 L52 170 C44 170 43 162 46 156 Z"
          fill="url(#bootSole)" stroke="#78350f" stroke-width="1.2"/>

    <!-- Cuerpo del botín -->
    <path d="M52 84 C62 94 74 96 84 82 C92 94 106 110 124 118 C148 128 186 130 194 148 C197 154 195 159 186 159 L50 159 C43 144 42 110 52 84 Z"
          fill="url(#bootGold)" stroke="#8a5609" stroke-width="1.6"/>

    <!-- 3 franjas laterales esculpidas -->
    <path d="M98 112 L84 155 M112 117 L98 155 M126 123 L112 155"
          stroke="#fff8cc" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <!-- Cordones -->
    <path d="M110 105 L122 100 M120 112 L132 107 M130 118 L142 113"
          stroke="#78350f" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Brillo en la puntera -->
    <path d="M156 136 C172 138 182 142 186 148" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.72"/>
  </g>
</svg>
