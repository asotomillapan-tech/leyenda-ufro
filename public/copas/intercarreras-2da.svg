<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 350" width="240" height="350" fill="none">
  <defs>
    <!-- Gradiente oro superior e interior -->
    <linearGradient id="goldUpper" x1="56" y1="30" x2="184" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9e670c"/>
      <stop offset="20%" stop-color="#f4ca50"/>
      <stop offset="42%" stop-color="#fff5ba"/>
      <stop offset="68%" stop-color="#dc9f1e"/>
      <stop offset="100%" stop-color="#875408"/>
    </linearGradient>

    <linearGradient id="goldInterior" x1="70" y1="36" x2="170" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5a3303"/>
      <stop offset="35%" stop-color="#b87a14"/>
      <stop offset="62%" stop-color="#f4c74e"/>
      <stop offset="100%" stop-color="#4e2b02"/>
    </linearGradient>

    <linearGradient id="goldHorizontal2" x1="60" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8d5809"/>
      <stop offset="24%" stop-color="#f7ce56"/>
      <stop offset="46%" stop-color="#fff8cc"/>
      <stop offset="72%" stop-color="#d4961a"/>
      <stop offset="100%" stop-color="#7c4b06"/>
    </linearGradient>

    <linearGradient id="goldHandle2" x1="0" y1="22" x2="0" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffeb9c"/>
      <stop offset="50%" stop-color="#e2aa2a"/>
      <stop offset="100%" stop-color="#8f5b08"/>
    </linearGradient>

    <!-- Gradiente plateado / cromado de la parte inferior del cáliz -->
    <linearGradient id="silverBowl" x1="62" y1="115" x2="178" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="22%" stop-color="#f8fafc"/>
      <stop offset="44%" stop-color="#ffffff"/>
      <stop offset="64%" stop-color="#cbd5e1"/>
      <stop offset="84%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="silverBlueTint" x1="120" y1="125" x2="120" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#1d4ed8" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.58"/>
    </linearGradient>

    <linearGradient id="silverPlaque" x1="92" y1="292" x2="148" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="pedestalDark2" x1="70" y1="274" x2="170" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2b2b34"/>
      <stop offset="50%" stop-color="#18181f"/>
      <stop offset="100%" stop-color="#0d0d12"/>
    </linearGradient>

    <!-- Cintas tricolor -->
    <linearGradient id="ribRed2" x1="0" y1="28" x2="0" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="ribWhite2" x1="0" y1="28" x2="0" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="ribBlue2" x1="0" y1="28" x2="0" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <radialGradient id="ambientGlow2" cx="120" cy="155" r="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#f5c842" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="silverBowlClip">
      <path d="M67 115 C71 172 91 215 120 222 C149 215 169 172 173 115 Z"/>
    </clipPath>
    <clipPath id="goldTopClip">
      <path d="M62 46 L178 46 C177 74 175 96 173 116 L67 116 C65 96 63 74 62 46 Z"/>
    </clipPath>
  </defs>

  <!-- Halo sutil -->
  <ellipse cx="120" cy="165" rx="95" ry="130" fill="url(#ambientGlow2)"/>
  <!-- Sombra inferior -->
  <ellipse cx="120" cy="336" rx="64" ry="8" fill="#000000" fill-opacity="0.45"/>

  <!-- ==================== 1. ASAS LATERALES CON PUNTAS ELEVADAS ==================== -->
  <!-- Asa Izquierda -->
  <path d="M65 55 C54 45 48 25 38 30 C28 35 32 60 44 82 C54 100 52 126 69 131"
        stroke="url(#goldHandle2)" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 30 L34 21 L42 27 Z" fill="#ffe999" stroke="#9e670c" stroke-width="0.8"/>
  <path d="M40 33 C33 42 36 60 46 80" stroke="#fff6c4" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- Asa Derecha -->
  <path d="M175 55 C186 45 192 25 202 30 C212 35 208 60 196 82 C186 100 188 126 171 131"
        stroke="url(#goldHandle2)" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M202 30 L206 21 L198 27 Z" fill="#ffe999" stroke="#9e670c" stroke-width="0.8"/>
  <path d="M200 33 C207 42 204 60 194 80" stroke="#fff6c4" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- ==================== 2. CINTAS TRICOLOR (IZQ Y DER) ==================== -->
  <!-- Cintas Izquierdas -->
  <g stroke-linecap="round">
    <path d="M35 34 C25 82 22 140 25 204" stroke="url(#ribRed2)" stroke-width="5"/>
    <path d="M38 35 C34 86 35 144 37 200" stroke="url(#ribWhite2)" stroke-width="4.4"/>
    <path d="M41 37 C42 90 46 150 48 214" stroke="url(#ribBlue2)" stroke-width="5"/>
    <circle cx="38" cy="34" r="4.8" fill="#e11d48" stroke="#f8fafc" stroke-width="1.4"/>
  </g>

  <!-- Cintas Derechas -->
  <g stroke-linecap="round">
    <path d="M199 37 C198 90 194 150 192 214" stroke="url(#ribBlue2)" stroke-width="5"/>
    <path d="M202 35 C206 86 205 144 203 200" stroke="url(#ribWhite2)" stroke-width="4.4"/>
    <path d="M205 34 C215 82 218 140 215 204" stroke="url(#ribRed2)" stroke-width="5"/>
    <circle cx="202" cy="34" r="4.8" fill="#2563eb" stroke="#f8fafc" stroke-width="1.4"/>
  </g>

  <!-- ==================== 3. PEDESTAL OSCURO Y PLACA PLATEADA ==================== -->
  <path d="M62 322 L178 322 L183 334 L57 334 Z" fill="url(#pedestalDark2)" stroke="#3f3f4e" stroke-width="1.2"/>
  <rect x="62" y="320" width="116" height="4" rx="1.5" fill="#2e2e38"/>
  <path d="M74 282 L166 282 L173 321 L67 321 Z" fill="url(#pedestalDark2)" stroke="#3b3b48" stroke-width="1.4"/>
  <path d="M74 282 L166 282 L160 276 L80 276 Z" fill="#32323e"/>
  <!-- Placa plateada frontal -->
  <rect x="92" y="290" width="56" height="23" rx="2.5" fill="url(#silverPlaque)" stroke="#64748b" stroke-width="1.2"/>
  <line x1="102" y1="299" x2="138" y2="299" stroke="#334155" stroke-width="1.4" stroke-opacity="0.45" stroke-linecap="round"/>
  <line x1="107" y1="305" x2="133" y2="305" stroke="#334155" stroke-width="1.4" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- ==================== 4. TALLO Y BASE DORADA ACAMPANADA ==================== -->
  <!-- Base acampanada abombada -->
  <path d="M107 242 C104 254 90 264 85 275 L155 275 C150 264 136 254 133 242 Z"
        fill="url(#goldHorizontal2)" stroke="#8a5609" stroke-width="1.1"/>
  <path d="M102 269 C110 258 115 250 116 244 L121 244 C121 253 116 263 108 271 Z" fill="#fff7cc" opacity="0.65"/>
  <!-- Anillo inferior sobre pedestal -->
  <rect x="82" y="273" width="76" height="5" rx="2.5" fill="url(#goldHorizontal2)"/>
  <!-- Anillo de cuello bajo el cáliz -->
  <ellipse cx="120" cy="233" rx="15" ry="7.5" fill="url(#goldHorizontal2)" stroke="#8a5609" stroke-width="1"/>
  <rect x="108" y="222" width="24" height="8" rx="3" fill="url(#goldHorizontal2)"/>

  <!-- ==================== 5. CÁLIZ INFERIOR PLATEADO CON RELIEVES ==================== -->
  <path d="M67 115 C71 172 91 215 120 222 C149 215 169 172 173 115 Z"
        fill="url(#silverBowl)" stroke="#64748b" stroke-width="1.3"/>

  <g clip-path="url(#silverBowlClip)">
    <!-- Reflejos azules profundos como el cromo de la foto -->
    <path d="M67 148 Q95 168 113 218 L78 225 L64 175 Z" fill="url(#silverBlueTint)"/>
    <path d="M173 148 Q145 168 127 218 L162 225 L176 175 Z" fill="url(#silverBlueTint)"/>
    <!-- Relieves en ondas/escamas estilizadas -->
    <path d="M74 140 Q96 156 120 144 Q144 156 166 140 Q145 170 120 162 Q95 170 74 140 Z"
          fill="#ffffff" opacity="0.72"/>
    <path d="M84 166 Q104 180 120 170 Q136 180 156 166 Q138 194 120 186 Q102 194 84 166 Z"
          fill="#e2e8f0" opacity="0.78"/>
    <path d="M98 190 Q110 202 120 196 Q130 202 142 190 Q130 212 120 218 Q110 212 98 190 Z"
          fill="#f8fafc" opacity="0.82"/>
    <!-- Brillo vertical izquierdo en el cromo -->
    <path d="M80 116 C82 150 90 182 103 206 L95 207 C82 181 74 150 72 116 Z" fill="#ffffff" opacity="0.72"/>
  </g>

  <!-- ==================== 6. BANDA SUPERIOR DORADA ESTRIADA + BOCA ABIERTA ==================== -->
  <!-- Cuerpo superior dorado -->
  <path d="M62 46 L178 46 C177 74 175 96 173 116 L67 116 C65 96 63 74 62 46 Z"
        fill="url(#goldUpper)" stroke="#8a5609" stroke-width="1.2"/>

  <!-- 3 estrías/anillos horizontales dorados característicos -->
  <g clip-path="url(#goldTopClip)">
    <path d="M62 69 Q120 77 178 69" stroke="#7c4a05" stroke-width="3.2" opacity="0.55"/>
    <path d="M62 66 Q120 74 178 66" stroke="#fff7c4" stroke-width="2" opacity="0.85"/>

    <path d="M63 83 Q120 91 177 83" stroke="#7c4a05" stroke-width="3.2" opacity="0.55"/>
    <path d="M63 80 Q120 88 177 80" stroke="#fff7c4" stroke-width="2" opacity="0.85"/>

    <path d="M65 97 Q120 105 175 97" stroke="#7c4a05" stroke-width="3.2" opacity="0.55"/>
    <path d="M65 94 Q120 102 175 94" stroke="#fff7c4" stroke-width="2" opacity="0.85"/>

    <!-- Brillo vertical en la banda dorada -->
    <rect x="81" y="46" width="11" height="72" fill="#fff9d6" opacity="0.42"/>
  </g>

  <!-- Anillo divisor oro / plata -->
  <path d="M65 113 Q120 120 175 113" stroke="#7c4a05" stroke-width="2.5"/>
  <path d="M66 111 Q120 118 174 111" stroke="#fff3b0" stroke-width="1.5"/>

  <!-- Boca abierta ovalada con interior dorado profundo -->
  <ellipse cx="120" cy="46" rx="58" ry="12" fill="url(#goldHorizontal2)" stroke="#8a5609" stroke-width="1.4"/>
  <ellipse cx="120" cy="46.5" rx="51" ry="8.5" fill="url(#goldInterior)"/>
  <path d="M74 48 C90 42 150 42 166 48" stroke="#ffe999" stroke-width="1.3" opacity="0.55"/>
</svg>
