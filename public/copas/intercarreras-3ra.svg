<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 330" width="240" height="330" fill="none">
  <defs>
    <!-- Gradientes bronce / cobre metálico para 3ª División -->
    <linearGradient id="bronzeBody" x1="56" y1="36" x2="184" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6e3813"/>
      <stop offset="22%" stop-color="#cf7e42"/>
      <stop offset="44%" stop-color="#ffd5a6"/>
      <stop offset="66%" stop-color="#b26028"/>
      <stop offset="86%" stop-color="#5e2e0f"/>
      <stop offset="100%" stop-color="#c4743b"/>
    </linearGradient>

    <linearGradient id="bronzeInterior" x1="72" y1="36" x2="168" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3c1b06"/>
      <stop offset="38%" stop-color="#8c4819"/>
      <stop offset="65%" stop-color="#d48347"/>
      <stop offset="100%" stop-color="#351704"/>
    </linearGradient>

    <linearGradient id="bronzeHorizontal" x1="60" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#63300e"/>
      <stop offset="24%" stop-color="#d68649"/>
      <stop offset="46%" stop-color="#ffe0ba"/>
      <stop offset="72%" stop-color="#a85822"/>
      <stop offset="100%" stop-color="#58290b"/>
    </linearGradient>

    <linearGradient id="bronzeHandle" x1="0" y1="35" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd5a6"/>
      <stop offset="48%" stop-color="#c5743b"/>
      <stop offset="100%" stop-color="#6b3511"/>
    </linearGradient>

    <linearGradient id="bronzeReflectionDark" x1="120" y1="95" x2="120" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2b1810" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#170d08" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="bronzePlaque" x1="92" y1="272" x2="148" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d98a4e"/>
      <stop offset="45%" stop-color="#ffe2bf"/>
      <stop offset="100%" stop-color="#a55723"/>
    </linearGradient>

    <linearGradient id="pedestalDark3" x1="70" y1="256" x2="170" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2b2b34"/>
      <stop offset="50%" stop-color="#18181f"/>
      <stop offset="100%" stop-color="#0d0d12"/>
    </linearGradient>

    <!-- Cintas tricolor características de Intercarreras -->
    <linearGradient id="ribRed3" x1="0" y1="44" x2="0" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="ribWhite3" x1="0" y1="44" x2="0" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="ribBlue3" x1="0" y1="44" x2="0" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <radialGradient id="ambientGlow3" cx="120" cy="145" r="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d98a4e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="bowlClip3">
      <path d="M64 46 L176 46 C174 128 152 184 120 194 C88 184 66 128 64 46 Z"/>
    </clipPath>
  </defs>

  <!-- Halo suave -->
  <ellipse cx="120" cy="150" rx="90" ry="120" fill="url(#ambientGlow3)"/>
  <!-- Sombra base -->
  <ellipse cx="120" cy="316" rx="62" ry="8" fill="#000000" fill-opacity="0.45"/>

  <!-- ==================== 1. ASAS LATERALES DE BRONCE ==================== -->
  <!-- Asa Izquierda -->
  <path d="M66 56 C44 46 36 66 44 92 C51 114 64 134 78 144"
        stroke="url(#bronzeHandle)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M46 58 C39 66 42 84 50 102"
        stroke="#ffe6c7" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Asa Derecha -->
  <path d="M174 56 C196 46 204 66 196 92 C189 114 176 134 162 144"
        stroke="url(#bronzeHandle)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M194 58 C201 66 198 84 190 102"
        stroke="#ffe6c7" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- ==================== 2. CINTAS TRICOLOR (IZQ Y DER) ==================== -->
  <g stroke-linecap="round">
    <path d="M40 52 C31 92 29 140 32 192" stroke="url(#ribRed3)" stroke-width="4.8"/>
    <path d="M43 52 C39 96 40 144 42 189" stroke="url(#ribWhite3)" stroke-width="4.2"/>
    <path d="M46 53 C46 99 49 148 51 198" stroke="url(#ribBlue3)" stroke-width="4.8"/>
    <circle cx="43" cy="52" r="4.5" fill="#e11d48" stroke="#f8fafc" stroke-width="1.4"/>
  </g>

  <g stroke-linecap="round">
    <path d="M194 53 C194 99 191 148 189 198" stroke="url(#ribBlue3)" stroke-width="4.8"/>
    <path d="M197 52 C201 96 200 144 198 189" stroke="url(#ribWhite3)" stroke-width="4.2"/>
    <path d="M200 52 C209 92 211 140 208 192" stroke="url(#ribRed3)" stroke-width="4.8"/>
    <circle cx="197" cy="52" r="4.5" fill="#2563eb" stroke="#f8fafc" stroke-width="1.4"/>
  </g>

  <!-- ==================== 3. PEDESTAL OSCURO Y PLACA DE BRONCE ==================== -->
  <path d="M64 302 L176 302 L181 314 L59 314 Z" fill="url(#pedestalDark3)" stroke="#3f3f4e" stroke-width="1.2"/>
  <rect x="64" y="300" width="112" height="4" rx="1.5" fill="#2e2e38"/>
  <path d="M75 262 L165 262 L172 301 L68 301 Z" fill="url(#pedestalDark3)" stroke="#3b3b48" stroke-width="1.4"/>
  <path d="M75 262 L165 262 L159 256 L81 256 Z" fill="#32323e"/>
  <!-- Placa bronce frontal -->
  <rect x="93" y="270" width="54" height="22" rx="2.5" fill="url(#bronzePlaque)" stroke="#7c3e15" stroke-width="1.2"/>
  <line x1="103" y1="278.5" x2="137" y2="278.5" stroke="#4a2209" stroke-width="1.4" stroke-opacity="0.45" stroke-linecap="round"/>
  <line x1="108" y1="284.5" x2="132" y2="284.5" stroke="#4a2209" stroke-width="1.4" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- ==================== 4. TALLO Y BASE DE BRONCE ==================== -->
  <path d="M108 214 C105 229 92 243 86 255 L154 255 C148 243 135 229 132 214 Z"
        fill="url(#bronzeHorizontal)" stroke="#683310" stroke-width="1.1"/>
  <path d="M103 249 C111 237 115 225 116 216 L121 216 C121 228 117 240 109 251 Z" fill="#ffe6c7" opacity="0.58"/>
  <rect x="83" y="253" width="74" height="5" rx="2.5" fill="url(#bronzeHorizontal)"/>
  <!-- Nudo bajo el cáliz -->
  <ellipse cx="120" cy="205" rx="15" ry="8" fill="url(#bronzeHorizontal)" stroke="#683310" stroke-width="1"/>
  <rect x="109" y="194" width="22" height="8" rx="3" fill="url(#bronzeHorizontal)"/>

  <!-- ==================== 5. CÁLIZ DE BRONCE ABIERTA ==================== -->
  <path d="M64 46 L176 46 C174 128 152 184 120 194 C88 184 66 128 64 46 Z"
        fill="url(#bronzeBody)" stroke="#6c3612" stroke-width="1.3"/>

  <g clip-path="url(#bowlClip3)">
    <!-- Contraste escultural inferior -->
    <path d="M64 114 Q94 138 114 190 L80 198 L60 144 Z" fill="url(#bronzeReflectionDark)"/>
    <path d="M176 114 Q146 138 126 190 L160 198 L180 144 Z" fill="url(#bronzeReflectionDark)"/>
    <!-- Relieve central en V -->
    <path d="M120 120 C106 136 98 158 120 190 C142 158 134 136 120 120 Z" fill="#ffe1bd" opacity="0.58"/>
    <!-- Doble anillo estriado superior característico -->
    <path d="M64 74 Q120 82 176 74" stroke="#5c2c0c" stroke-width="3" opacity="0.55"/>
    <path d="M64 71 Q120 79 176 71" stroke="#ffe5c4" stroke-width="1.8" opacity="0.82"/>
    <path d="M65 89 Q120 97 175 89" stroke="#5c2c0c" stroke-width="3" opacity="0.55"/>
    <path d="M65 86 Q120 94 175 86" stroke="#ffe5c4" stroke-width="1.8" opacity="0.82"/>
    <!-- Brillo vertical izquierdo -->
    <path d="M81 48 C81 94 88 136 102 174 L94 175 C80 137 73 95 73 48 Z" fill="#fff0db" opacity="0.52"/>
  </g>

  <!-- Boca abierta ovalada con interior bronce oscuro -->
  <ellipse cx="120" cy="46" rx="56" ry="11.5" fill="url(#bronzeHorizontal)" stroke="#6c3612" stroke-width="1.4"/>
  <ellipse cx="120" cy="46.5" rx="49" ry="8" fill="url(#bronzeInterior)"/>
  <path d="M75 48 C91 42 149 42 165 48" stroke="#ffd8ab" stroke-width="1.2" opacity="0.5"/>
</svg>
