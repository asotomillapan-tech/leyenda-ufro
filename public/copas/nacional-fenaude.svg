    <polygon points="84,121 85.4,124.2 88.8,124.5 86.2,126.7 87,130 84,128.2 81,130 81.8,126.7 79.2,124.5 82.6,124.2"/>
    <polygon points="84,134 85.4,137.2 88.8,137.5 86.2,139.7 87,143 84,141.2 81,143 81.8,139.7 79.2,137.5 82.6,137.2"/>
    <polygon points="84,147 85.4,150.2 88.8,150.5 86.2,152.7 87,156 84,154.2 81,156 81.8,152.7 79.2,150.5 82.6,150.2"/>
    <polygon points="84,160 85.4,163.2 88.8,163.5 86.2,165.7 87,169 84,167.2 81,169 81.8,165.7 79.2,163.5 82.6,163.2"/>
    <polygon points="84,173 85.4,176.2 88.8,176.5 86.2,178.7 87,182 84,180.2 81,182 81.8,178.7 79.2,176.5 82.6,176.2"/>
    <polygon points="84,186 85.4,189.2 88.8,189.5 86.2,191.7 87,195 84,193.2 81,195 81.8,191.7 79.2,189.5 82.6,189.2"/>
    <polygon points="84,199 85.4,202.2 88.8,202.5 86.2,204.7 87,208 84,206.2 81,208 81.8,204.7 79.2,202.5 82.6,202.2"/>
    <polygon points="85,212 86.4,215.2 89.8,215.5 87.2,217.7 88,221 85,219.2 82,221 82.8,217.7 80.2,215.5 83.6,215.2"/>

