    <polygon points="90,224 91.4,227.2 94.8,227.5 92.2,229.7 93,233 90,231.2 87,233 87.8,229.7 85.2,227.5 88.6,227.2"/>
    <polygon points="99,234 100.4,237.2 103.8,237.5 101.2,239.7 102,243 99,241.2 96,243 96.8,239.7 94.2,237.5 97.6,237.2"/>
    <polygon points="110,241 111.4,244.2 114.8,244.5 112.2,246.7 113,250 110,248.2 107,250 107.8,246.7 105.2,244.5 108.6,244.2"/>
    <polygon points="123,245 124.4,248.2 127.8,248.5 125.2,250.7 126,254 123,252.2 120,254 120.8,250.7 118.2,248.5 121.6,248.2"/>
    <polygon points="137,245 138.4,248.2 141.8,248.5 139.2,250.7 140,254 137,252.2 134,254 134.8,250.7 132.2,248.5 135.6,248.2"/>
    <polygon points="150,241 151.4,244.2 154.8,244.5 152.2,246.7 153,250 150,248.2 147,250 147.8,246.7 145.2,244.5 148.6,244.2"/>
    <polygon points="161,234 162.4,237.2 165.8,237.5 163.2,239.7 164,243 161,241.2 158,243 158.8,239.7 156.2,237.5 159.6,237.2"/>
    <polygon points="170,224 171.4,227.2 174.8,227.5 172.2,229.7 173,233 170,231.2 167,233 167.8,229.7 165.2,227.5 168.6,227.2"/>

    <!-- Columna derecha (de abajo hacia arriba) -->
    <polygon points="175,212 176.4,215.2 179.8,215.5 177.2,217.7 178,221 175,219.2 172,221 172.8,217.7 170.2,215.5 173.6,215.2"/>
    <polygon points="176,199 177.4,202.2 180.8,202.5 178.2,204.7 179,208 176,206.2 173,208 173.8,204.7 171.2,202.5 174.6,202.2"/>
    <polygon points="176,186 177.4,189.2 180.8,189.5 178.2,191.7 179,195 176,193.2 173,195 173.8,191.7 171.2,189.5 174.6,189.2"/>
    <polygon points="176,173 177.4,176.2 180.8,176.5 178.2,178.7 179,182 176,180.2 173,182 173.8,178.7 171.2,176.5 174.6,176.2"/>
    <polygon points="176,160 177.4,163.2 180.8,163.5 178.2,165.7 179,169 176,167.2 173,169 173.8,165.7 171.2,163.5 174.6,163.2"/>
    <polygon points="176,147 177.4,150.2 180.8,150.5 178.2,152.7 179,156 176,154.2 173,156 173.8,152.7 171.2,150.5 174.6,150.2"/>
    <polygon points="176,134 177.4,137.2 180.8,137.5 178.2,139.7 179,143 176,141.2 173,143 173.8,139.7 171.2,137.5 174.6,137.2"/>
    <polygon points="176,121 177.4,124.2 180.8,124.5 178.2,126.7 179,130 176,128.2 173,130 173.8,126.7 171.2,124.5 174.6,124.2"/>
  </g>

  <!-- ==================== 6. LOGOTIPO CENTRAL FENAUDE ==================== -->
  <!-- Trazo azul marino externo de la "F" -->
  <path d="M104 196 L104 150 C104 134 114 126 132 126 L157 126"
        stroke="#fff3b5" stroke-width="10" stroke-linecap="round"/>
  <path d="M104 196 L104 150 C104 134 114 126 132 126 L157 126"
        stroke="#111c3a" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Trazo rojo interno de la "F" -->
  <path d="M118 196 L118 153 C118 140 126 135 140 135 L157 135"
        stroke="#fff3b5" stroke-width="9" stroke-linecap="round"/>
  <path d="M118 196 L118 153 C118 140 126 135 140 135 L157 135"
        stroke="#991b1b" stroke-width="6.6" stroke-linecap="round"/>

  <!-- Punto rojo a la derecha -->
  <circle cx="139" cy="164" r="9.5" fill="#991b1b" stroke="#fff3b5" stroke-width="1.4"/>

  <!-- ==================== 7. TEXTO FENAUDE / CHILE ==================== -->
  <text x="130" y="218" text-anchor="middle"
        font-family="Inter, Arial, sans-serif" font-weight="900" font-size="16" letter-spacing="0.8"
        fill="#0f172a" stroke="#fff3b5" stroke-width="0.6" paint-order="stroke">FENAUDE</text>
  <text x="130" y="233" text-anchor="middle"
        font-family="Inter, Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="1.4"
        fill="#991b1b" stroke="#fff3b5" stroke-width="0.5" paint-order="stroke">CHILE</text>
</svg>
