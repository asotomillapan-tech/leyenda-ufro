  <!-- Bisel interior brillante -->
  <circle cx="130" cy="196" r="94" fill="none" stroke="#fff7c7" stroke-width="1.2" opacity="0.65"/>

  <!-- Reflejo diagonal sutil del metal -->
  <path d="M62 128 A96 96 0 0 1 198 128 L174 152 A64 64 0 0 0 86 152 Z" fill="#ffffff" opacity="0.16"/>

