    <path d="M138 286 C100 278 65 245 56 184" fill="none" stroke="#8c5809" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M122 286 C160 278 195 245 204 184" fill="none" stroke="#8c5809" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Hojas lado izquierdo -->
