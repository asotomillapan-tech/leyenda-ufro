    <ellipse cx="86" cy="250" rx="8.5" ry="3.8" transform="rotate(-8 86 250)"/>
    <ellipse cx="74" cy="233" rx="8.2" ry="3.6" transform="rotate(-24 74 233)"/>
    <ellipse cx="67" cy="213" rx="8" ry="3.5" transform="rotate(-40 67 213)"/>

    <!-- Hojas lado derecho -->
    <ellipse cx="151" cy="276" rx="10" ry="4.5" transform="rotate(12 151 276)"/>
    <ellipse cx="168" cy="266" rx="10.5" ry="4.6" transform="rotate(32 168 266)"/>
    <ellipse cx="183" cy="252" rx="10.5" ry="4.6" transform="rotate(48 183 252)"/>
    <ellipse cx="194" cy="234" rx="10" ry="4.5" transform="rotate(64 194 234)"/>
    <ellipse cx="201" cy="215" rx="9.5" ry="4.3" transform="rotate(76 201 215)"/>
    <ellipse cx="204" cy="195" rx="9" ry="4" transform="rotate(86 204 195)"/>
    <!-- Hojas internas derechas -->
    <ellipse cx="159" cy="264" rx="8.5" ry="3.8" transform="rotate(-14 159 264)"/>
    <ellipse cx="174" cy="250" rx="8.5" ry="3.8" transform="rotate(8 174 250)"/>
    <ellipse cx="186" cy="233" rx="8.2" ry="3.6" transform="rotate(24 186 233)"/>
    <ellipse cx="193" cy="213" rx="8" ry="3.5" transform="rotate(40 193 213)"/>
  </g>

