<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" width="260" height="320" fill="none">
  <defs>
    <!-- Cinta roja superior FENAUDE -->
    <linearGradient id="medalRibbon" x1="88" y1="0" x2="172" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="28%" stop-color="#dc2626"/>
      <stop offset="55%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Oro texturizado de la medalla -->
    <radialGradient id="medalGoldFace" cx="122" cy="176" r="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4b3"/>
      <stop offset="35%" stop-color="#f5ca48"/>
      <stop offset="72%" stop-color="#d49c1a"/>
      <stop offset="100%" stop-color="#a6720c"/>
    </radialGradient>

    <linearGradient id="medalRim" x1="34" y1="92" x2="226" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff2ad"/>
      <stop offset="28%" stop-color="#d89e1f"/>
      <stop offset="52%" stop-color="#fff9cf"/>
      <stop offset="78%" stop-color="#b87e11"/>
      <stop offset="100%" stop-color="#f2c445"/>
    </linearGradient>

    <linearGradient id="medalBail" x1="84" y1="54" x2="176" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d49c1e"/>
      <stop offset="45%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#9c6709"/>
    </linearGradient>

    <linearGradient id="laurelGold" x1="60" y1="180" x2="200" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b47b12"/>
      <stop offset="50%" stop-color="#f3c548"/>
      <stop offset="100%" stop-color="#8c5907"/>
    </linearGradient>

    <radialGradient id="medalGlow" cx="130" cy="196" r="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo sutil -->
  <circle cx="130" cy="196" r="122" fill="url(#medalGlow)"/>
  <!-- Sombra de profundidad -->
  <circle cx="130" cy="200" r="103" fill="#000000" fill-opacity="0.42"/>

  <!-- ==================== 1. ARGOLLA SUPERIOR DORADA ==================== -->
  <path d="M90 98 L90 77 C90 59 106 50 130 50 C154 50 170 59 170 77 L170 98"
        stroke="url(#medalBail)" stroke-width="11" stroke-linecap="round"/>
  <path d="M90 98 L90 77 C90 59 106 50 130 50 C154 50 170 59 170 77 L170 98"
        stroke="#fff6c7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- ==================== 2. CINTA ROJA SUPERIOR ==================== -->
  <path d="M97 0 L163 0 L163 69 C163 74 159 77 154 77 L106 77 C101 77 97 74 97 69 Z"
        fill="url(#medalRibbon)" stroke="#7f1d1d" stroke-width="1.2"/>
  <!-- Costuras / pliegues sutiles de la cinta -->
  <line x1="103" y1="0" x2="103" y2="76" stroke="#fca5a5" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.35"/>
  <line x1="157" y1="0" x2="157" y2="76" stroke="#fca5a5" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.35"/>
  <rect x="97" y="64" width="66" height="13" rx="3" fill="#991b1b" opacity="0.32"/>

  <!-- ==================== 3. DISCO DORADO DE LA MEDALLA ==================== -->
  <circle cx="130" cy="196" r="104" fill="url(#medalRim)" stroke="#7c4c07" stroke-width="1.8"/>
