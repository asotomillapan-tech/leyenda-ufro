    <ellipse cx="92" cy="266" rx="10.5" ry="4.6" transform="rotate(-32 92 266)"/>
    <ellipse cx="77" cy="252" rx="10.5" ry="4.6" transform="rotate(-48 77 252)"/>
    <ellipse cx="66" cy="234" rx="10" ry="4.5" transform="rotate(-64 66 234)"/>
    <ellipse cx="59" cy="215" rx="9.5" ry="4.3" transform="rotate(-76 59 215)"/>
    <ellipse cx="56" cy="195" rx="9" ry="4" transform="rotate(-86 56 195)"/>
