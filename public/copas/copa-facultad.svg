<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340" fill="none">
  <defs>
    <!-- Plata académica + azul índigo UFRO para Copa de Facultad -->
    <linearGradient id="facSilver" x1="60" y1="38" x2="180" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="22%" stop-color="#e2e8f0"/>
      <stop offset="44%" stop-color="#ffffff"/>
      <stop offset="68%" stop-color="#cbd5e1"/>
      <stop offset="90%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="facIndigo" x1="70" y1="44" x2="170" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b48c9"/>
      <stop offset="50%" stop-color="#717fff"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <linearGradient id="facRim" x1="58" y1="0" x2="182" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="28%" stop-color="#f1f5f9"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="76%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="facPedestal" x1="68" y1="260" x2="172" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#282834"/>
      <stop offset="50%" stop-color="#17171f"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>

    <radialGradient id="facGlow" cx="120" cy="145" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#717fff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="150" rx="92" ry="120" fill="url(#facGlow)"/>
  <ellipse cx="120" cy="326" rx="60" ry="7.5" fill="#000000" fill-opacity="0.45"/>

  <!-- Asas estilizadas plateadas con remate índigo -->
  <path d="M68 68 C42 64 34 86 44 114 C52 135 68 152 83 162"
        stroke="url(#facSilver)" stroke-width="7.2" stroke-linecap="round"/>
  <path d="M68 68 C46 66 38 86 47 110" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="42" cy="76" r="4.5" fill="#717fff" stroke="#e2e8f0" stroke-width="1.3"/>

  <path d="M172 68 C198 64 206 86 196 114 C188 135 172 152 157 162"
        stroke="url(#facSilver)" stroke-width="7.2" stroke-linecap="round"/>
  <path d="M172 68 C194 66 202 86 193 110" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="198" cy="76" r="4.5" fill="#717fff" stroke="#e2e8f0" stroke-width="1.3"/>

  <!-- Pedestal oscuro y placa azul/plata -->
  <path d="M64 312 L176 312 L181 324 L59 324 Z" fill="url(#facPedestal)" stroke="#3f3f4e" stroke-width="1.2"/>
  <path d="M74 270 L166 270 L172 311 L68 311 Z" fill="url(#facPedestal)" stroke="#3b3b4c" stroke-width="1.4"/>
  <path d="M74 270 L166 270 L159 264 L81 264 Z" fill="#323242"/>
  <rect x="91" y="279" width="58" height="23" rx="2.5" fill="url(#facRim)" stroke="#475569" stroke-width="1.2"/>
  <rect x="97" y="285" width="46" height="4" rx="2" fill="#717fff" opacity="0.75"/>
  <rect x="104" y="293" width="32" height="3" rx="1.5" fill="#334155" opacity="0.5"/>

  <!-- Tallo plateado y cuello índigo -->
  <path d="M107 224 C104 242 93 255 85 264 L155 264 C147 255 136 242 133 224 Z"
        fill="url(#facRim)" stroke="#475569" stroke-width="1.1"/>
  <rect x="83" y="261" width="74" height="5" rx="2.5" fill="url(#facRim)"/>
  <ellipse cx="120" cy="214" rx="15" ry="9" fill="url(#facIndigo)" stroke="#c7d2fe" stroke-width="1.2"/>

  <!-- Cáliz principal plateado moderno -->
  <path d="M64 56 L176 56 C174 128 156 188 120 205 C84 188 66 128 64 56 Z"
        fill="url(#facSilver)" stroke="#475569" stroke-width="1.4"/>

  <!-- Banda superior azul índigo -->
  <path d="M65 56 L175 56 L174 82 L66 82 Z" fill="url(#facIndigo)"/>
  <path d="M66 82 Q120 88 174 82" stroke="#e2e8f0" stroke-width="2.2"/>

  <!-- Escudo heráldico frontal de Facultad -->
  <path d="M98 102 L142 102 L142 136 C142 156 120 172 120 172 C120 172 98 156 98 136 Z"
        fill="url(#facIndigo)" stroke="#f8fafc" stroke-width="2.2"/>
  <path d="M120 113 L123.5 123 L134 123.5 L125.8 130 L128.8 140 L120 134 L111.2 140 L114.2 130 L106 123.5 L116.5 123 Z"
        fill="#f8fafc"/>

  <!-- Brillo vertical izquierdo -->
  <path d="M77 84 C78 124 85 162 98 186 L90 187 C77 162 71 124 70 84 Z" fill="#ffffff" opacity="0.65"/>

  <!-- Boca abierta con borde torneado -->
  <ellipse cx="120" cy="56" rx="58" ry="11" fill="url(#facRim)" stroke="#475569" stroke-width="1.3"/>
  <ellipse cx="120" cy="56.5" rx="50" ry="7.5" fill="#1e1b4b"/>
  <path d="M76 57 C94 52 146 52 164 57" stroke="#a5b4fc" stroke-width="1.4" opacity="0.6"/>
</svg>
