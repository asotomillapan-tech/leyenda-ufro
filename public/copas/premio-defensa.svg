<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" fill="none">
  <defs>
    <!-- Premio Muralla Defensiva / Defensor del Año: Escudo Acero y Oro -->
    <linearGradient id="defSteel" x1="55" y1="35" x2="185" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="28%" stop-color="#e2e8f0"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="defGold" x1="55" y1="30" x2="185" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9e670b"/>
      <stop offset="28%" stop-color="#f7cf54"/>
      <stop offset="52%" stop-color="#fff8cc"/>
      <stop offset="100%" stop-color="#875407"/>
    </linearGradient>

    <linearGradient id="defCore" x1="80" y1="55" x2="160" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="defPedestal" x1="65" y1="205" x2="175" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292934"/>
      <stop offset="50%" stop-color="#17171f"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>

    <radialGradient id="defGlow" cx="120" cy="120" r="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="122" r="102" fill="url(#defGlow)"/>
  <ellipse cx="120" cy="268" rx="64" ry="7" fill="#000000" fill-opacity="0.45"/>

  <!-- Pedestal oscuro -->
  <path d="M58 254 L182 254 L187 265 L53 265 Z" fill="url(#defPedestal)" stroke="#3f3f4e" stroke-width="1.2"/>
  <path d="M70 212 L170 212 L177 253 L63 253 Z" fill="url(#defPedestal)" stroke="#3b3b48" stroke-width="1.4"/>
  <rect x="86" y="220" width="68" height="24" rx="3" fill="url(#defSteel)" stroke="#475569" stroke-width="1.2"/>
  <text x="120" y="236" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="10" letter-spacing="0.9" fill="#0f172a">DEFENSA</text>

  <!-- Soporte metálico -->
  <path d="M108 184 L132 184 L138 212 L102 212 Z" fill="url(#defGold)" stroke="#8a5609" stroke-width="1.1"/>

  <!-- Gran Escudo Aegis Dorado y Acero -->
  <path d="M120 34 L182 58 L178 122 C174 162 146 186 120 198 C94 186 66 162 62 122 L58 58 Z"
        fill="url(#defGold)" stroke="#8a5609" stroke-width="2"/>
  <path d="M120 46 L170 66 L167 120 C163 153 140 174 120 184 C100 174 77 153 73 120 L70 66 Z"
        fill="url(#defSteel)" stroke="#475569" stroke-width="1.4"/>
  <path d="M120 58 L158 74 L156 118 C153 145 135 162 120 170 C105 162 87 145 84 118 L82 74 Z"
        fill="url(#defCore)" stroke="#fff7cc" stroke-width="1.3"/>

  <!-- Cruz de muralla / pilar defensivo en oro -->
  <path d="M114 78 L126 78 L126 106 L146 106 L146 118 L126 118 L126 150 L114 150 L114 118 L94 118 L94 106 L114 106 Z"
        fill="url(#defGold)" stroke="#fff7cc" stroke-width="1"/>
</svg>
