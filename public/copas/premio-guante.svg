<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" fill="none">
  <defs>
    <!-- Guante de Oro (Arquero) -->
    <linearGradient id="gloveGold" x1="55" y1="30" x2="185" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9e670b"/>
      <stop offset="24%" stop-color="#f7cf54"/>
      <stop offset="48%" stop-color="#fff8cc"/>
      <stop offset="76%" stop-color="#d4961a"/>
      <stop offset="100%" stop-color="#875407"/>
    </linearGradient>

    <linearGradient id="glovePalm" x1="75" y1="65" x2="165" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#9a640b"/>
    </linearGradient>

    <linearGradient id="glovePedestal" x1="65" y1="205" x2="175" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292934"/>
      <stop offset="50%" stop-color="#17171f"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>

    <radialGradient id="gloveGlow" cx="120" cy="122" r="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="122" r="102" fill="url(#gloveGlow)"/>
  <ellipse cx="120" cy="268" rx="64" ry="7" fill="#000000" fill-opacity="0.45"/>

  <!-- Pedestal oscuro -->
  <path d="M58 254 L182 254 L187 265 L53 265 Z" fill="url(#glovePedestal)" stroke="#3f3f4e" stroke-width="1.2"/>
  <path d="M70 212 L170 212 L177 253 L63 253 Z" fill="url(#glovePedestal)" stroke="#3b3b48" stroke-width="1.4"/>
  <rect x="86" y="220" width="68" height="24" rx="3" fill="url(#gloveGold)" stroke="#8c580a" stroke-width="1.2"/>
  <text x="120" y="236" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="10" letter-spacing="0.9" fill="#451a03">GUANTE</text>

  <!-- Base de muñequera del guante -->
  <path d="M94 176 L146 176 L150 212 L90 212 Z" fill="url(#gloveGold)" stroke="#8a5609" stroke-width="1.3"/>
  <rect x="86" y="182" width="68" height="18" rx="5" fill="url(#gloveGold)" stroke="#78350f" stroke-width="1.2"/>
  <rect x="102" y="187" width="36" height="7" rx="3" fill="#fff7cc" opacity="0.8"/>

  <!-- Silueta de Guante de Arquero Dorado (palma + 4 dedos + pulgar) -->
  <path d="M84 176 C78 158 76 142 74 134 C60 130 50 116 55 104 C60 94 72 98 80 108 L80 62 C80 51 94 51 94 62 L94 94 L98 46 C98 34 114 34 114 46 L114 90 L119 42 C119 30 135 30 135 42 L135 92 L140 54 C140 43 155 43 155 54 L155 124 C155 152 148 166 144 176 Z"
        fill="url(#gloveGold)" stroke="#8a5609" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Detalles de costura de palma y agarre -->
  <path d="M88 112 C96 104 136 104 146 116 C148 140 140 164 134 170 L94 170 C88 156 86 134 88 112 Z"
        fill="url(#glovePalm)" stroke="#fff7cc" stroke-width="1.2" opacity="0.82"/>
  <path d="M96 134 Q118 124 138 134" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M99 148 Q118 140 135 148" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
</svg>
