<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340" fill="none">
  <defs>
    <!-- Copa Univerciudad: plata brillante + celeste turquesa urbano + oro -->
    <linearGradient id="uniSilver" x1="60" y1="45" x2="180" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="24%" stop-color="#f1f5f9"/>
      <stop offset="48%" stop-color="#ffffff"/>
      <stop offset="76%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="uniTeal" x1="70" y1="55" x2="170" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="uniGold" x1="65" y1="0" x2="175" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9e670b"/>
      <stop offset="30%" stop-color="#f7cf54"/>
      <stop offset="55%" stop-color="#fff8cc"/>
      <stop offset="100%" stop-color="#8a5609"/>
    </linearGradient>

    <linearGradient id="uniPedestal" x1="68" y1="260" x2="172" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#282834"/>
      <stop offset="50%" stop-color="#17171f"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>

    <radialGradient id="uniGlow" cx="120" cy="145" r="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="150" rx="92" ry="120" fill="url(#uniGlow)"/>
  <ellipse cx="120" cy="326" rx="60" ry="7.5" fill="#000000" fill-opacity="0.45"/>

  <!-- Asas angulares urbanas -->
  <path d="M68 72 L40 82 L46 132 L78 156"
        stroke="url(#uniSilver)" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M172 72 L200 82 L194 132 L162 156"
        stroke="url(#uniSilver)" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pedestal oscuro -->
  <path d="M64 312 L176 312 L181 324 L59 324 Z" fill="url(#uniPedestal)" stroke="#3f3f4e" stroke-width="1.2"/>
  <path d="M74 270 L166 270 L172 311 L68 311 Z" fill="url(#uniPedestal)" stroke="#3b3b4c" stroke-width="1.4"/>
  <rect x="91" y="279" width="58" height="23" rx="2.5" fill="url(#uniGold)" stroke="#8c580a" stroke-width="1.2"/>
  <line x1="101" y1="288" x2="139" y2="288" stroke="#7c530b" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="107" y1="294" x2="133" y2="294" stroke="#7c530b" stroke-width="1.4" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- Tallo y base -->
  <path d="M107 224 C104 242 93 255 85 264 L155 264 C147 255 136 242 133 224 Z"
        fill="url(#uniGold)" stroke="#8a5609" stroke-width="1"/>
  <rect x="83" y="261" width="74" height="5" rx="2.5" fill="url(#uniGold)"/>
  <ellipse cx="120" cy="214" rx="15" ry="9" fill="url(#uniTeal)" stroke="#cffafe" stroke-width="1.2"/>

  <!-- Cáliz cónico moderno -->
  <path d="M64 56 L176 56 C172 132 154 188 120 205 C86 188 68 132 64 56 Z"
        fill="url(#uniSilver)" stroke="#475569" stroke-width="1.4"/>
  <path d="M67 84 Q120 96 173 84 L169 116 Q120 128 71 116 Z" fill="url(#uniTeal)"/>
  <!-- Silueta de torre/ciudad estilizada en oro sobre el cáliz -->
  <path d="M104 162 L104 134 L111 134 L111 124 L120 116 L129 124 L129 134 L136 134 L136 162 Z"
        fill="url(#uniGold)" stroke="#78350f" stroke-width="0.9"/>
  <path d="M78 62 C79 115 86 158 98 184 L90 185 C78 158 72 115 71 62 Z" fill="#ffffff" opacity="0.62"/>

  <!-- Boca abierta -->
  <ellipse cx="120" cy="56" rx="58" ry="11" fill="url(#uniGold)" stroke="#8a5609" stroke-width="1.3"/>
  <ellipse cx="120" cy="56.5" rx="50" ry="7.5" fill="#082f49"/>
</svg>
