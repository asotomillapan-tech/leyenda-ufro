<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" fill="none">
  <defs>
    <!-- Hazaña 3ª -> 1ª División: Obelisco dorado alado en 3 peldaños -->
    <linearGradient id="hazGold" x1="50" y1="25" x2="190" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9e670b"/>
      <stop offset="25%" stop-color="#f7cf54"/>
      <stop offset="48%" stop-color="#fff8cc"/>
      <stop offset="75%" stop-color="#d89d1c"/>
      <stop offset="100%" stop-color="#875407"/>
    </linearGradient>

    <linearGradient id="hazAmber" x1="120" y1="20" x2="120" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="hazPedestal" x1="65" y1="240" x2="175" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292934"/>
      <stop offset="50%" stop-color="#17171f"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>

    <radialGradient id="hazGlow" cx="120" cy="135" r="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="145" rx="95" ry="125" fill="url(#hazGlow)"/>
  <ellipse cx="120" cy="306" rx="64" ry="7.5" fill="#000000" fill-opacity="0.45"/>

  <!-- Alas de ascenso laterales -->
  <path d="M96 154 C62 134 38 102 34 68 C58 84 78 96 98 118 Z" fill="url(#hazGold)" stroke="#8a5609" stroke-width="1.2"/>
  <path d="M92 170 C65 156 48 134 45 108 C65 120 80 132 96 146 Z" fill="url(#hazAmber)" stroke="#8a5609" stroke-width="1"/>
  <path d="M144 154 C178 134 202 102 206 68 C182 84 162 96 142 118 Z" fill="url(#hazGold)" stroke="#8a5609" stroke-width="1.2"/>
  <path d="M148 170 C175 156 192 134 195 108 C175 120 160 132 144 146 Z" fill="url(#hazAmber)" stroke="#8a5609" stroke-width="1"/>

  <!-- Pedestal oscuro -->
  <path d="M58 292 L182 292 L187 304 L53 304 Z" fill="url(#hazPedestal)" stroke="#3f3f4e" stroke-width="1.2"/>
  <path d="M70 250 L170 250 L177 291 L63 291 Z" fill="url(#hazPedestal)" stroke="#3b3b48" stroke-width="1.4"/>
  <rect x="88" y="259" width="64" height="22" rx="2.5" fill="url(#hazGold)" stroke="#8c580a" stroke-width="1.2"/>
  <text x="120" y="274" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="10.5" letter-spacing="0.8" fill="#451a03">3ª → 1ª</text>

  <!-- 3 peldaños ascendentes + obelisco central -->
  <rect x="82" y="228" width="76" height="16" rx="3" fill="url(#hazGold)" stroke="#8a5609" stroke-width="1.1"/>
  <rect x="92" y="206" width="56" height="22" rx="3" fill="url(#hazGold)" stroke="#8a5609" stroke-width="1.1"/>
  <path d="M102 206 L108 72 L120 44 L132 72 L138 206 Z" fill="url(#hazGold)" stroke="#8a5609" stroke-width="1.4"/>
  <!-- Flecha ascendente luminosa interna -->
  <path d="M120 64 L132 94 L124 94 L124 192 L116 192 L116 94 L108 94 Z" fill="#fffbeb" opacity="0.82"/>

  <!-- Corona / Estrella de 1ª División en la cima -->
  <circle cx="120" cy="34" r="16" fill="url(#hazGold)" stroke="#fff7cc" stroke-width="1.8"/>
  <path d="M120 22 L123.3 30.2 L132 30.8 L125.4 36.4 L127.5 45 L120 40.2 L112.5 45 L114.6 36.4 L108 30.8 L116.7 30.2 Z"
        fill="#78350f"/>
</svg>
