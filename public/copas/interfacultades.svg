<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 370" width="260" height="370" fill="none">
  <defs>
    <!-- Oro blanco / platino + oro real para Torneo Interfacultades -->
    <linearGradient id="interGold" x1="65" y1="40" x2="195" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9e670b"/>
      <stop offset="22%" stop-color="#f7cf54"/>
      <stop offset="45%" stop-color="#fff8cc"/>
      <stop offset="70%" stop-color="#d89d1c"/>
      <stop offset="100%" stop-color="#875407"/>
    </linearGradient>

    <linearGradient id="interPlatinum" x1="72" y1="60" x2="188" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="82%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="interRoyal" x1="80" y1="90" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="interPedestal" x1="65" y1="290" x2="195" y2="358" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a36"/>
      <stop offset="50%" stop-color="#171720"/>
      <stop offset="100%" stop-color="#0b0b10"/>
    </linearGradient>

    <radialGradient id="interGlow" cx="130" cy="155" r="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7cf54" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#717fff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="130" cy="165" rx="108" ry="138" fill="url(#interGlow)"/>
  <ellipse cx="130" cy="356" rx="74" ry="8" fill="#000000" fill-opacity="0.48"/>

  <!-- Asas amplias tipo "Champions" (alas ascendentes) -->
  <path d="M74 96 C46 72 28 76 32 104 C36 132 58 164 88 184"
        stroke="url(#interGold)" stroke-width="9" stroke-linecap="round"/>
  <path d="M74 96 C50 77 35 80 38 103 C41 124 57 150 82 172"
        stroke="#fff6c4" stroke-width="2.3" stroke-linecap="round" opacity="0.8"/>

  <path d="M186 96 C214 72 232 76 228 104 C224 132 202 164 172 184"
        stroke="url(#interGold)" stroke-width="9" stroke-linecap="round"/>
  <path d="M186 96 C210 77 225 80 222 103 C219 124 203 150 178 172"
        stroke="#fff6c4" stroke-width="2.3" stroke-linecap="round" opacity="0.8"/>

  <!-- Pedestal ancho escalonado de gala -->
  <path d="M56 340 L204 340 L210 354 L50 354 Z" fill="url(#interPedestal)" stroke="#475569" stroke-width="1.2"/>
  <path d="M70 294 L190 294 L198 339 L62 339 Z" fill="url(#interPedestal)" stroke="#3f3f4e" stroke-width="1.4"/>
  <path d="M70 294 L190 294 L182 287 L78 287 Z" fill="#323242"/>
  <rect x="94" y="303" width="72" height="26" rx="3" fill="url(#interGold)" stroke="#8c580a" stroke-width="1.2"/>
  <line x1="106" y1="312" x2="154" y2="312" stroke="#7c530b" stroke-width="1.7" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="112" y1="320" x2="148" y2="320" stroke="#7c530b" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Tallo escultural oro + platino -->
  <path d="M114 242 C110 262 96 276 84 287 L176 287 C164 276 150 262 146 242 Z"
        fill="url(#interGold)" stroke="#8a5609" stroke-width="1.1"/>
  <rect x="81" y="284" width="98" height="5.5" rx="2.7" fill="url(#interGold)"/>
  <ellipse cx="130" cy="231" rx="18" ry="10" fill="url(#interPlatinum)" stroke="#64748b" stroke-width="1.1"/>
  <rect x="112" y="216" width="36" height="9" rx="4" fill="url(#interGold)"/>

  <!-- Cáliz majestuoso facetado -->
  <path d="M70 76 L190 76 C188 148 168 202 130 218 C92 202 72 148 70 76 Z"
        fill="url(#interGold)" stroke="#8c580a" stroke-width="1.5"/>

  <!-- Franja central índigo real + estrella de las facultades -->
  <path d="M72 104 Q130 116 188 104 L184 140 Q130 152 76 140 Z"
        fill="url(#interRoyal)" stroke="#fff3b5" stroke-width="1.4"/>
  <!-- Emblema globo / estrella dorada central -->
  <circle cx="130" cy="126" r="20" fill="url(#interPlatinum)" stroke="#f7cf54" stroke-width="2.4"/>
  <ellipse cx="130" cy="126" rx="19" ry="7" stroke="#6366f1" stroke-width="1.3"/>
  <ellipse cx="130" cy="126" rx="8" ry="19" stroke="#6366f1" stroke-width="1.3"/>
  <path d="M130 112 L133 121 L142 121.5 L135 127 L137.5 136 L130 130.8 L122.5 136 L125 127 L118 121.5 L127 121 Z"
        fill="#f59e0b" stroke="#78350f" stroke-width="0.6"/>

  <!-- Facetas inferiores brillantes -->
  <path d="M130 156 L112 184 L130 212 L148 184 Z" fill="#fff7cc" opacity="0.68"/>
  <path d="M84 80 L94 80 C93 130 100 172 114 200 L104 202 C89 172 83 130 84 80 Z" fill="#fff9d6" opacity="0.52"/>

  <!-- Corona superior y tapa facetada con remate de estrella -->
  <ellipse cx="130" cy="76" rx="62" ry="11" fill="url(#interGold)" stroke="#8a5609" stroke-width="1.3"/>
  <path d="M76 74 C82 52 102 42 130 42 C158 42 178 52 184 74 Z"
        fill="url(#interPlatinum)" stroke="#64748b" stroke-width="1.2"/>
  <rect x="124" y="28" width="12" height="15" rx="3" fill="url(#interGold)"/>
  <circle cx="130" cy="22" r="10" fill="url(#interGold)" stroke="#fff7cc" stroke-width="1.5"/>
  <path d="M130 14 L132.2 19.5 L138 20 L133.5 23.6 L135 29.2 L130 26 L125 29.2 L126.5 23.6 L122 20 L127.8 19.5 Z"
        fill="#312e81"/>
</svg>
