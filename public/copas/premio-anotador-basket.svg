<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" fill="none">
  <defs>
    <!-- Máximo Anotador Básquetbol: Balón Dorado sobre Aro con Red -->
    <radialGradient id="baskGold" cx="104" cy="76" r="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff8cc"/>
      <stop offset="32%" stop-color="#f7cf54"/>
      <stop offset="72%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <linearGradient id="baskRim" x1="60" y1="110" x2="180" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <linearGradient id="baskSilver" x1="70" y1="125" x2="170" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="baskPedestal" x1="65" y1="205" x2="175" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292934"/>
      <stop offset="50%" stop-color="#17171f"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>

    <radialGradient id="baskGlow" cx="120" cy="115" r="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="118" r="102" fill="url(#baskGlow)"/>
  <ellipse cx="120" cy="268" rx="64" ry="7" fill="#000000" fill-opacity="0.45"/>

  <!-- Pedestal oscuro -->
  <path d="M58 254 L182 254 L187 265 L53 265 Z" fill="url(#baskPedestal)" stroke="#3f3f4e" stroke-width="1.2"/>
  <path d="M70 212 L170 212 L177 253 L63 253 Z" fill="url(#baskPedestal)" stroke="#3b3b48" stroke-width="1.4"/>
  <rect x="84" y="220" width="72" height="24" rx="3" fill="url(#baskGold)" stroke="#8c580a" stroke-width="1.2"/>
  <text x="120" y="236" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="10" letter-spacing="0.8" fill="#451a03">ANOTADOR</text>

  <!-- Tallo dorado -->
  <path d="M108 182 L132 182 L140 212 L100 212 Z" fill="url(#baskGold)" stroke="#8a5609" stroke-width="1.1"/>

  <!-- Balón de básquetbol dorado entrando al aro -->
  <circle cx="120" cy="86" r="46" fill="url(#baskGold)" stroke="#78350f" stroke-width="1.8"/>
  <path d="M74 86 L166 86 M120 40 L120 132" stroke="#78350f" stroke-width="2.2" opacity="0.65"/>
  <path d="M88 53 C105 70 105 102 88 119 M152 53 C135 70 135 102 152 119"
        stroke="#78350f" stroke-width="2.2" opacity="0.65"/>

  <!-- Aro naranja/oro en primer plano + malla plateada -->
  <ellipse cx="120" cy="126" rx="58" ry="12" stroke="url(#baskRim)" stroke-width="7.5"/>
  <path d="M72 132 L88 182 L152 182 L168 132" stroke="url(#baskSilver)" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M84 134 L106 182 M102 136 L124 182 M120 137 L140 182 M156 134 L134 182 M138 136 L116 182 M120 137 L100 182"
        stroke="url(#baskSilver)" stroke-width="2" stroke-linecap="round"/>
</svg>
