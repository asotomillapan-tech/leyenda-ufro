<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" fill="none">
  <defs>
    <!-- MVP / Balón de Oro Estrella -->
    <radialGradient id="mvpGoldBall" cx="106" cy="94" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff9d6"/>
      <stop offset="28%" stop-color="#f7cf54"/>
      <stop offset="68%" stop-color="#d4961a"/>
      <stop offset="100%" stop-color="#875407"/>
    </radialGradient>

    <linearGradient id="mvpRibbon" x1="60" y1="70" x2="180" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#e5ae2d"/>
      <stop offset="100%" stop-color="#9a640b"/>
    </linearGradient>

    <linearGradient id="mvpPedestal" x1="65" y1="205" x2="175" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292934"/>
      <stop offset="50%" stop-color="#17171f"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>

    <radialGradient id="mvpGlow" cx="120" cy="120" r="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="122" r="102" fill="url(#mvpGlow)"/>
  <ellipse cx="120" cy="268" rx="64" ry="7" fill="#000000" fill-opacity="0.45"/>

  <!-- Pedestal oscuro y placa MVP -->
  <path d="M58 254 L182 254 L187 265 L53 265 Z" fill="url(#mvpPedestal)" stroke="#3f3f4e" stroke-width="1.2"/>
  <path d="M70 212 L170 212 L177 253 L63 253 Z" fill="url(#mvpPedestal)" stroke="#3b3b48" stroke-width="1.4"/>
  <rect x="88" y="220" width="64" height="24" rx="3" fill="url(#mvpRibbon)" stroke="#8c580a" stroke-width="1.2"/>
  <text x="120" y="236" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" fill="#451a03">MVP</text>

  <!-- Cinta / Soporte helicoidal dorado bajo el balón -->
  <path d="M98 184 C94 196 86 205 80 212 L160 212 C154 205 146 196 142 184 Z"
        fill="url(#mvpRibbon)" stroke="#8a5609" stroke-width="1.1"/>
  <path d="M56 128 C60 166 86 188 120 192 C154 188 180 166 184 128 C170 156 148 170 120 170 C92 170 70 156 56 128 Z"
        fill="url(#mvpRibbon)" stroke="#8a5609" stroke-width="1.2"/>

  <!-- Esfera Balón de Oro -->
  <circle cx="120" cy="110" r="58" fill="url(#mvpGoldBall)" stroke="#8a5609" stroke-width="1.8"/>
  <!-- Líneas geométricas estilizadas -->
  <polygon points="120,86 141,101 133,126 107,126 99,101" fill="#b47b12" fill-opacity="0.35" stroke="#fff7cc" stroke-width="1.4"/>
  <path d="M120 86 L120 53 M141 101 L172 91 M133 126 L154 156 M107 126 L86 156 M99 101 L68 91"
        stroke="#fff7cc" stroke-width="1.3" stroke-opacity="0.65"/>

  <!-- Estrella de MVP coronando la cima -->
  <path d="M120 18 L126.5 34 L144 35.2 L130.5 46.2 L134.8 63 L120 53.6 L105.2 63 L109.5 46.2 L96 35.2 L113.5 34 Z"
        fill="#fff8cc" stroke="#9a640b" stroke-width="1.5"/>
</svg>
