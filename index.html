        function renderActionPanel(team) {
            const panel = document.getElementById('action-panel');

            // 1. SIMULAR SEMESTRE
            if (careerState.phase === 'PLAY_SEMESTER') {
                const isS2 = careerState.currentSemester === 2;
                const ufroCompLabel = isS2
                    ? (careerState.fenaudeQualified ? 'LDES · Univerciudad · Nacional FENAUDE' : 'LDES · Univerciudad')

                panel.innerHTML = `
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">

                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="text-xs font-extrabold uppercase text-[#8b96ff]">Año ${careerState.currentYear} · Semestre ${careerState.currentSemester}</span>
                                ${isS2 ? '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-[#717fff]/15 text-[#a3adff] border border-[#717fff]/30">🌍 Final Intercarreras + Interfacultades</span>' : '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-[#151515] text-gray-300 border border-[#2b2b2b]">🏆 Copa Facultad + 1ª Rueda</span>'}

                        <button onclick="triggerPlaySemester()" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-[#717fff] hover:bg-[#828eff] text-white font-black text-sm shadow-lg shadow-[#717fff]/25 transition transform active:scale-95">

                `;
            }
            // 2. EVENTOS ESPECIALES
            else if (careerState.phase === 'RANDOM_EVENT' && careerState.activeEvent) {
                const ev = careerState.activeEvent;
                const res = careerState.eventResult;

                if (!res) {
                    // A) Evento exclusivo de Regreso Triunfal
                    if (ev.type === 'TRIUMPHANT_RETURN') {
                        panel.innerHTML = `
                            <div class="animate-pop space-y-4">
                                <div class="flex items-center justify-between">

                                        ${ev.badge}
                                    </span>
                                    <span class="text-xs text-gray-500">Año ${careerState.currentYear} · S${careerState.currentSemester}</span>
                                </div>
                                <div>
                                    <h3 class="text-xl font-black text-white">${ev.title}</h3>
                                    <p class="text-sm text-gray-300 mt-1">${ev.desc}</p>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">

                                    </button>
                                    <button onclick="resolveClubSwitchEvent(true)" class="py-3 px-4 rounded-xl bg-[#717fff] hover:bg-[#828eff] text-white font-black text-xs sm:text-sm shadow-lg transition">
                                        Regreso triunfal a ${ev.targetTeamName}
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                    // B) Evento exclusivo de Ingeniería Comercial ("Suena el teléfono...")
                    else if (ev.type === 'ICO_MONEY') {
                        panel.innerHTML = `
                            <div class="animate-pop space-y-4">
                                <div class="flex items-center justify-between">
                                    <span class="px-2.5 py-1 rounded-full text-xs font-extrabold bg-[#717fff]/15 text-[#a3adff] border border-[#717fff]/30">
                                        ${ev.badge}
                                    </span>
                                    <span class="text-xs text-gray-500">Año ${careerState.currentYear} · S${careerState.currentSemester}</span>
                                </div>
                                <div>

                                    <p class="text-sm text-gray-300 mt-1">${ev.desc}</p>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                                    <button onclick="resolveClubSwitchEvent(false)" class="py-3 px-4 rounded-xl bg-[#717fff] hover:bg-[#828eff] text-white font-black text-xs sm:text-sm shadow-lg transition">

                                    <button onclick="resolveClubSwitchEvent(true)" class="py-3 px-4 rounded-xl bg-[#151515] hover:bg-[#222222] text-gray-200 font-bold text-xs sm:text-sm border border-[#2b2b2b] transition">
                                        💸 Irse por plata (${ev.targetTeamName})
                                    </button>
                                </div>
                            </div>

                    }
                    // C) Evento estándar de riesgo / recompensa
                    else {

                            <div class="animate-pop space-y-4">

                                    <span class="px-2.5 py-1 rounded-full text-xs font-extrabold bg-[#717fff]/15 text-[#a3adff] border border-[#717fff]/30">
                                        ⚡ ${ev.badge}
                                    </span>
                                    <span class="text-xs text-gray-500">Año ${careerState.currentYear} · S${careerState.currentSemester}</span>
                                </div>
                                <div>
                                    <h3 class="text-xl font-black text-white">${ev.title}</h3>
                                    <p class="text-sm text-gray-300 mt-1">${ev.desc}</p>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                                    <button onclick="resolveRandomEvent(true)" class="py-3 px-4 rounded-xl bg-[#717fff] hover:bg-[#828eff] text-white font-black text-xs sm:text-sm shadow-lg transition">
                                        🎲 ${ev.riskLabel}
                                    </button>
                                    <button onclick="resolveRandomEvent(false)" class="py-3 px-4 rounded-xl bg-[#151515] hover:bg-[#222222] text-gray-200 font-bold text-xs sm:text-sm border border-[#2b2b2b] transition">
                                        🛡️ ${ev.safeLabel}
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    const boxStyle = res.neutral
                        ? 'surface-sub text-gray-200'
                        : res.success
                            ? 'bg-[#717fff]/15 border-[#717fff]/45 text-[#d0d5ff]'
                            : 'bg-rose-950/40 border-rose-500/40 text-rose-200';

                    panel.innerHTML = `
                        <div class="animate-pop space-y-4">
                            <div class="p-4 rounded-xl border ${boxStyle}">
                                <div class="text-xs font-black uppercase tracking-wider mb-1">
                                    ${res.neutral ? 'Decisión Tomada' : res.success ? '✅ Resultado Positivo' : '❌ Contratiempo'}
                                </div>
                                <p class="text-sm font-bold">${res.text}</p>
                            </div>
                            <button onclick="continueAfterEvent()" class="w-full py-3 rounded-xl bg-[#717fff] hover:bg-[#828eff] text-white font-extrabold text-sm transition">
                                Continuar Semestre →
                            </button>
                        </div>
                    `;
                }
            }
            // 3. MERCADO DE PASES (CON CARRERA ESPECIFICADA EN CADA EQUIPO)
            else if (careerState.phase === 'TRANSFER_MARKET') {
                const offers = careerState.pendingOffers.map(c => findTeamByCode(c)).filter(Boolean);
                const stayRole = getPlayingRoleProjection(careerState.ovr, team.ovr);

                panel.innerHTML = `
                    <div class="space-y-3.5">
                        <div class="flex items-center justify-between border-b border-[#262626] pb-2.5">
                            <h3 class="text-base font-black text-white">Mercado de Pases (Fin S${careerState.currentSemester})</h3>
                            <span class="text-xs text-gray-400">Tu Media: <strong class="text-[#8b96ff]">${careerState.ovr}</strong></span>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                            <!-- Quedarse en club actual -->
                            <div class="p-3.5 rounded-xl surface-sub border-[#717fff]/50 flex flex-col justify-between gap-3">
                                <div>
                                    <span class="text-[10px] font-bold uppercase text-[#8b96ff]">Club Actual</span>
                                    <div class="font-extrabold text-white text-sm mt-0.5">${team.name}</div>
                                    <div class="text-[11px] text-[#a3adff] font-medium mt-0.5">${team.career}</div>
                                    <div class="text-[11px] text-gray-500 mt-0.5">${getDivisionLabel(team.division, careerState.gender)} · OVR ${team.ovr}</div>
                                    <span class="inline-block mt-2 text-[10px] px-2 py-0.5 rounded font-bold ${stayRole.badgeClass}">${stayRole.label}</span>
                                </div>
                                <button onclick="resolveTransferDecision('${team.code}')" class="w-full py-2 rounded-lg bg-[#717fff] hover:bg-[#828eff] text-white text-xs font-bold transition">
                                    Seguir Aquí
                                </button>
                            </div>

                            <!-- Ofertas nuevas (nunca equipos anteriores) -->
                            ${offers.map(o => {
                                const oRole = getPlayingRoleProjection(careerState.ovr, o.ovr);
                                return `
                                    <div class="p-3.5 rounded-xl surface-sub hover:border-[#717fff]/45 flex flex-col justify-between gap-3 transition">
                                        <div>
                                            <span class="text-[10px] font-bold uppercase text-gray-400">Oferta Fichaje</span>
                                            <div class="font-extrabold text-white text-sm mt-0.5">${o.name}</div>
                                            <div class="text-[11px] text-[#8b96ff] font-medium mt-0.5">${o.career}</div>
                                            <div class="text-[11px] text-gray-500 mt-0.5">${getDivisionLabel(o.division, careerState.gender)} · OVR ${o.ovr}</div>
                                            <span class="inline-block mt-2 text-[10px] px-2 py-0.5 rounded font-bold ${oRole.badgeClass}">${oRole.label}</span>
                                        </div>
                                        <button onclick="resolveTransferDecision('${o.code}')" class="w-full py-2 rounded-lg bg-[#222222] hover:bg-[#717fff] text-white text-xs font-bold border border-[#303030] transition">
                                            Fichar
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
            // 4. EXTENSIÓN DE CARRERA
            else if (careerState.phase === 'EXTENSION_CHOICE') {
                const rem = 2 - careerState.extensionUsed;
                panel.innerHTML = `
                    <div class="space-y-3">
                        <h3 class="text-lg font-black text-white">🎓 Completaste tus ${careerState.maxYears} años en la UFRO</h3>
                        <p class="text-xs text-gray-400">¿Egresas hoy o extiendes tu carrera universitaria para seguir compitiendo?</p>
                        <div class="flex flex-wrap gap-2.5 pt-1">
                            <button onclick="graduateAndRetire()" class="px-4 py-2.5 rounded-xl bg-[#717fff] hover:bg-[#828eff] text-white font-black text-xs sm:text-sm">
                                🎓 Titularse y Finalizar
                            </button>
                            ${rem >= 1 ? `<button onclick="extendUniversityCareer(1, 'Magíster')" class="px-4 py-2.5 rounded-xl bg-[#151515] hover:bg-[#222222] text-[#a3adff] border border-[#2b2b2b] font-bold text-xs sm:text-sm">+1 Año (Magíster)</button>` : ''}
                            ${rem >= 2 ? `<button onclick="extendUniversityCareer(2, 'Doble Titulación')" class="px-4 py-2.5 rounded-xl bg-[#151515] hover:bg-[#222222] text-[#a3adff] border border-[#2b2b2b] font-bold text-xs sm:text-sm">+2 Años (Doble Título)</button>` : ''}
                        </div>
                    </div>
                `;
            }
            // 5. EGRESADO
            else if (careerState.phase === 'RETIRED') {
                panel.innerHTML = `
                    <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                        <div>
                            <h3 class="text-lg font-black text-[#8b96ff]">🎓 ¡Leyenda Egresada UFRO!</h3>
                            <p class="text-xs text-gray-300">Media Final: <strong>${careerState.ovr}</strong> · Títulos: <strong>${careerState.trophies.length}</strong></p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="switchTab('palmares')" class="px-4 py-2.5 rounded-xl bg-[#717fff] text-white font-black text-xs">Ver Resumen</button>
                            <button onclick="resetCareer()" class="px-4 py-2.5 rounded-xl bg-[#151515] text-gray-300 border border-[#2b2b2b] font-bold text-xs">Nueva Carrera</button>
                        </div>
                    </div>
                `;
            }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            if (!careerState || careerState.history.length === 0) {
                container.innerHTML = `<div class="surface-card rounded-xl p-6 text-center text-xs text-gray-500">Juega tu primer semestre para ver tu historial aquí.</div>`;
                return;
            }

            const grouped = {};
            careerState.history.forEach(h => {
                if (!grouped[h.year]) grouped[h.year] = [];
                grouped[h.year].push(h);
            });

            const years = Object.keys(grouped).map(Number).sort((a, b) => b - a);
            container.innerHTML = years.map(yr => {
                const sems = grouped[yr].sort((a, b) => b.sem - a.sem);
                return `
                    <div class="surface-card rounded-2xl p-4 space-y-3">
                        <div class="text-xs font-black uppercase tracking-wider text-gray-500 border-b border-[#262626] pb-2">
                            Año ${yr}
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${sems.map(s => `
                                <div class="p-3.5 rounded-xl surface-sub space-y-2 text-xs">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <span class="font-bold text-[#8b96ff]">Semestre ${s.sem}</span> · <span class="text-gray-500">${getDivisionLabel(s.divisionPlayed, careerState.gender)}</span>
                                            <div class="font-extrabold text-white text-sm">${s.teamName}</div>
                                            <div class="text-[11px] text-gray-500">${s.careerName}</div>
                                        </div>
                                        <div class="text-right">
                                            <span class="px-2 py-0.5 rounded bg-[#222222] font-bold text-white border border-[#2b2b2b]">
                                                OVR ${s.ovrAfter} <span class="text-[#8b96ff]">(+${s.ovrDelta})</span>
                                            </span>
                                            <div class="text-[11px] text-gray-500 mt-0.5">Nota: <strong class="text-white">${s.avgRating}</strong></div>
                                        </div>
                                    </div>

                                    <div class="flex justify-between bg-[#101010] px-3 py-1.5 rounded-lg text-gray-300">
                                        <span>PJ: <strong class="text-white">${s.matches}</strong></span>
                                        <span>${careerState.position === 'ARQ' ? 'VI' : 'Goles'}: <strong class="text-[#8b96ff]">${careerState.position === 'ARQ' ? s.cleanSheets : s.goals}</strong></span>
                                        <span>Asist: <strong class="text-[#717fff]">${s.assists}</strong></span>
                                        <span>${s.leagueSummaryText || `Liga: #${s.leaguePosition}`} ${s.promoted ? '⬆' : s.relegated ? '⬇' : ''}</span>
                                    </div>

                                    <div class="flex flex-wrap gap-1.5 text-[11px]">
                                        ${s.facultyCupResult ? `<span class="px-2 py-0.5 rounded bg-[#222222] text-gray-300 border border-[#2b2b2b]">${s.facultyCupResult}</span>` : ''}
                                        ${s.interfacultadesResult ? `<span class="px-2 py-0.5 rounded bg-[#717fff]/15 text-[#a3adff] border border-[#717fff]/25">${s.interfacultadesResult}</span>` : ''}
                                        ${s.ufroSelectionInfo ? `<span class="px-2 py-0.5 rounded bg-[#717fff]/10 text-[#a3adff] border border-[#717fff]/20">${s.ufroSelectionInfo}</span>` : ''}
                                    </div>

                                    ${s.trophies && s.trophies.length > 0 ? `
                                        <div class="flex flex-wrap gap-1 pt-1">
                                            ${s.trophies.map(t => `<span class="px-2 py-0.5 rounded bg-[#717fff]/20 text-[#a3adff] border border-[#717fff]/30 font-bold text-[11px]">🏆 ${t.title}</span>`).join('')}
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }
<!-- ... existing code ... -->
            cardEl.innerHTML = `
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-[#717fff] to-[#98a2ff] flex flex-col items-center justify-center shadow-xl">
                            <span class="text-[10px] font-bold uppercase text-white/80">MEDIA</span>
                            <span class="text-3xl font-black text-white">${careerState.ovr}</span>
                            <span class="text-[11px] font-bold text-white/90">${careerState.position}</span>
                        </div>
                        <div>
                            <h3 class="text-xl font-black text-white">${careerState.playerName}</h3>
                            <p class="text-xs text-gray-400 mt-0.5">${team.name} · ${careerState.history.length} Semestres · ${careerState.stats.matches} PJ</p>
                            <p class="text-xs text-[#8b96ff] mt-0.5">🇨🇱 Selección UFRO: ${careerState.ufroStats.matches} PJ · ${careerState.ufroStats.goals} G · ${careerState.ufroStats.assists} A</p>
                        </div>
                    </div>
                    <div class="text-center surface-sub px-5 py-3 rounded-xl">
                        <div class="text-2xl font-black text-[#8b96ff]">${trophies.length}</div>
                        <div class="text-[10px] font-bold uppercase text-gray-500">Títulos Totales</div>
                    </div>
                </div>
            `;

            const cats = [
                { icon: '🌍', title: 'Interfacultades', count: countInter },
                { icon: '🏆', title: 'Intercarreras', count: countLeague },
                { icon: '🏛️', title: 'Copas Facultad', count: countFac },
                { icon: '🇨🇱', title: 'Selección UFRO', count: countSel }
            ];

            gridEl.innerHTML = cats.map(c => `
                <div class="surface-card rounded-xl p-4 flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <span class="text-lg">${c.icon}</span>
                        <span class="font-bold text-xs sm:text-sm text-gray-200">${c.title}</span>
                    </div>
                    <span class="text-xl font-black ${c.count > 0 ? 'text-[#8b96ff]' : 'text-gray-600'}">${c.count}</span>
                </div>
            `).join('');

            // Renderizar etapas simplificadas por equipo
            const stints = buildChronologicalClubStints();
            if (stints.length === 0) {
                stintsEl.innerHTML = `<p class="text-xs text-gray-500">Aún no has completado semestres en ningún equipo.</p>`;
            } else {
                stintsEl.innerHTML = stints.map(st => {
                    const trophiesSummary = summarizeTrophiesGrouped(st.trophies);
                    const hasTrophies = st.trophies.length > 0;
                    return `
                        <div class="p-4 rounded-xl surface-sub flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="font-black text-white text-sm">${st.teamName}</span>
                                    <span class="px-2 py-0.5 rounded bg-[#222222] text-[11px] font-bold text-[#8b96ff] border border-[#2b2b2b]">
                                        ${formatDurationLabel(st.semesters)}
                                    </span>
                                </div>
                                <div class="text-[11px] text-gray-500 mt-0.5">${st.careerName} · ${st.startLabel} → ${st.endLabel}</div>
                            </div>
                            <div class="text-xs font-bold ${hasTrophies ? 'text-[#a3adff]' : 'text-gray-500'} sm:text-right">
                                ${hasTrophies ? `🏆 ${trophiesSummary}` : trophiesSummary}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Renderizar detalle completo semestre a semestre (para el desplegable)
            fullSemEl.innerHTML = careerState.history.length === 0
                ? `<p class="text-xs text-gray-500">Sin registros semestrales.</p>`
                : careerState.history.slice().reverse().map(h => `
                    <div class="p-3 rounded-xl bg-[#101010] border border-[#222222] flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                        <div>
                            <span class="font-bold text-[#8b96ff]">Año ${h.year} · S${h.sem}</span> — <strong class="text-white">${h.teamName}</strong> <span class="text-gray-500">(${h.careerName})</span>
                            <div class="text-[11px] text-gray-400 mt-0.5">
                                PJ: ${h.matches} · G: ${h.goals} · A: ${h.assists} · Nota: ${h.avgRating} · ${h.leagueSummaryText || `Liga #${h.leaguePosition}`}
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="px-2 py-0.5 rounded bg-[#1c1c1c] text-white font-bold border border-[#2b2b2b]">OVR ${h.ovrAfter}</span>
                            ${h.trophies && h.trophies.length > 0 ? `<div class="text-[11px] text-[#a3adff] font-bold mt-1">🏆 ${h.trophies.map(t => t.title).join(', ')}</div>` : ''}
                        </div>
                    </div>
                `).join('');
        }

        // =========================================================================
        // 11. TOASTS
        // =========================================================================
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-[#1c1c1c] border-[#717fff]/50 text-[#d0d5ff]',
                error: 'bg-rose-950/95 border-rose-500/50 text-rose-200',
                info: 'bg-[#1c1c1c] border-[#2e2e2e] text-gray-200'
            };
            toast.className = `pointer-events-auto p-3 rounded-xl border shadow-xl text-xs font-bold transition-all duration-300 transform translate-y-2 opacity-0 ${colors[type]}`;
            toast.textContent = msg;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3400);
        }
    </script>
</body>
